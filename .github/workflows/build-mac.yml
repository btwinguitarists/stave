name: Build Mac

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Regression tests
        run: npm test

      - name: Build .dmg
        run: npx electron-builder --mac --publish never

      # The public Mac release is signed and notarized by the local release pipeline.
      - name: Preserve CI package
        uses: actions/upload-artifact@v4
        with:
          name: mac-ci-package
          path: dist/*.dmg
