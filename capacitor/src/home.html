<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Stave</title>
  <link rel="stylesheet" href="ios.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1c1c1e; --bg2: #252528;
      --text: #f0e8d8; --text2: #9a9080; --text3: #4e4a44;
      --accent: #c8922a; --accent2: #a07420;
      --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
      --font: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    }
    html, body {
      width: 100%; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-weight: 300;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    #wrap {
      max-width: 720px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 110px);
    }
    header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
    #wordmark { font-size: 22px; letter-spacing: 0.22em; color: var(--text); }
    #wordmark .t { color: var(--accent); }
    #storage {
      margin-left: auto; font-size: 11px; color: var(--text3);
      background: none; border: none; font-family: var(--font);
      padding: 6px 0 6px 12px;
    }
    #storage.connected { color: var(--text2); }
    #pending-dot {
      display: none; width: 6px; height: 6px; border-radius: 3px;
      background: var(--accent); align-self: center;
    }
    #tagline { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 26px; }
    #search {
      width: 100%; padding: 12px 14px; margin-bottom: 20px;
      background: var(--bg2); color: var(--text);
      border: 0.5px solid var(--border); border-radius: 8px;
      font-family: var(--font); font-size: 16px; font-weight: 300;
      outline: none;
    }
    #search::placeholder { color: var(--text3); }
    #search:focus { border-color: var(--border2); }
    .note {
      padding: 16px 2px; border-bottom: 0.5px solid var(--border);
      cursor: pointer;
      -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
    }
    .note:active { background: var(--bg2); }
    .note-top { display: flex; align-items: baseline; gap: 10px; }
    .note-dot { font-size: 10px; color: var(--accent); }
    .note.longform .note-dot { color: #7f77dd; }
    .note-title {
      font-size: 15px; color: var(--text); font-weight: 400;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .note-date { margin-left: auto; font-size: 11px; color: var(--text3); flex-shrink: 0; }
    .note-snippet {
      margin-top: 5px; padding-left: 20px;
      font-size: 12.5px; color: var(--text2); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    #empty {
      display: none; text-align: center; padding: 90px 20px 0; color: var(--text2);
      font-size: 14px; line-height: 2;
    }
    #empty .glyph { font-size: 34px; color: var(--accent); display: block; margin-bottom: 14px; }
    #new-note {
      position: fixed; right: 26px; bottom: calc(env(safe-area-inset-bottom) + 26px);
      width: 60px; height: 60px; border-radius: 30px;
      background: var(--accent); color: #1c1c1e; border: none;
      font-size: 30px; font-weight: 300; line-height: 0;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      cursor: pointer;
    }
    #new-note:active { background: var(--accent2); }
    #sheet-back {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 10;
    }
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
      background: var(--bg2); border-top: 0.5px solid var(--border2);
      border-radius: 18px 18px 0 0;
      padding: 26px 26px calc(env(safe-area-inset-bottom) + 30px);
      transform: translateY(105%); transition: transform 0.28s ease;
    }
    #sheet.open { transform: none; }
    #sheet h2 { font-size: 13px; letter-spacing: 0.12em; color: var(--text2); margin-bottom: 14px; font-weight: 400; }
    #sheet p { font-size: 13px; color: var(--text2); line-height: 1.8; margin-bottom: 18px; }
    #sheet .primary {
      width: 100%; padding: 14px; border-radius: 10px; border: none;
      background: var(--accent); color: #1c1c1e;
      font-family: var(--font); font-size: 15px; cursor: pointer;
    }
    #sheet .quiet {
      width: 100%; padding: 13px; margin-top: 10px; border-radius: 10px;
      background: none; border: 0.5px solid var(--border2); color: var(--text2);
      font-family: var(--font); font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <header>
      <div id="wordmark">S<span class="t">†</span>AVE</div>
      <div id="pending-dot" title="saves pending"></div>
      <button id="storage" onclick="openSheet()">on this iPad</button>
    </header>
    <div id="tagline">a quiet place to write</div>
    <input id="search" type="search" placeholder="search your pages" autocomplete="off">
    <div id="list"></div>
    <div id="empty">
      <span class="glyph">S†</span>
      Your first page is waiting.
    </div>
  </div>
  <button id="new-note" title="New page">+</button>

  <div id="note-sheet-back" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:10;" onclick="closeNoteSheet()"></div>
  <div id="note-sheet" style="position:fixed; left:0; right:0; bottom:0; z-index:11; background:var(--bg2); border-top:0.5px solid var(--border2); border-radius:18px 18px 0 0; padding:24px 24px calc(env(safe-area-inset-bottom) + 26px); transform:translateY(105%); transition:transform 0.25s ease;">
    <h2 id="note-sheet-title" style="font-size:13px; letter-spacing:0.1em; color:var(--text2); margin-bottom:16px; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></h2>
    <button class="primary" style="width:100%; padding:15px; border-radius:10px; border:none; background:var(--accent); color:#1c1c1e; font-family:var(--font); font-size:15px;" onclick="noteSheetOpen()">Write</button>
    <button class="quiet" style="width:100%; padding:14px; margin-top:10px; border-radius:10px; background:none; border:0.5px solid var(--border2); color:var(--text2); font-family:var(--font); font-size:14px;" onclick="noteSheetExport()">Export</button>
    <button id="note-sheet-delete" class="quiet" style="width:100%; padding:14px; margin-top:10px; border-radius:10px; background:none; border:0.5px solid rgba(200,80,60,0.5); color:#c85a3c; font-family:var(--font); font-size:14px;" onclick="noteSheetDelete()">Delete</button>
    <button class="quiet" style="width:100%; padding:14px; margin-top:10px; border-radius:10px; background:none; border:0.5px solid var(--border2); color:var(--text2); font-family:var(--font); font-size:14px;" onclick="closeNoteSheet()">Cancel</button>
  </div>

  <div id="sheet-back" onclick="closeSheet()"></div>
  <div id="sheet">
    <h2>WHERE YOUR WORDS LIVE</h2>
    <p id="sheet-info"></p>
    <button class="primary" id="connect-btn" onclick="connectFolder()">Connect iCloud Drive folder</button>
    <button class="quiet" onclick="closeSheet()">Close</button>
  </div>

  <script src="stave-core.js"></script>
  <script src="shim.js"></script>
  <script src="home.js"></script>
</body>
</html>
